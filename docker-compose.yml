networks:
  ecommerce-network:
    name: ecommerce-network
    driver: bridge

services:
  db:
    image: postgres:17.5-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    env_file:
      - .env
    volumes:
      - ecommerce_db:/var/lib/postgresql/data
    networks:
      - ecommerce-network
    container_name: ecommerce-db
    
  redis:
    image: redis:7.4.0-alpine
    networks:
      - ecommerce-network
    container_name: ecommerce-redis
  
  web:
    image: ecommerce-app:latest
    command: gunicorn --bind 0.0.0.0:8000 --workers 2 --threads 5 --reload config.wsgi:application
    volumes:
      - shared:/shared
      - .:/e-commerce
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - .env
    networks:
      - ecommerce-network
    container_name: ecommerce-web   
  
  worker:
    image: ecommerce-app:latest
    command: celery -A config worker --loglevel=info
    volumes:
      - shared:/shared
      - .:/e-commerce
    depends_on:
      - db
      - redis
    env_file:
      - .env
    networks:
      - ecommerce-network
    container_name: ecommerce-worker

  beat:
    image: ecommerce-app:latest
    command: celery -A config beat --loglevel=info
    volumes:
      - shared:/shared
      - .:/e-commerce
    depends_on:
      - db
      - redis
    env_file:
      - .env
    networks:
      - ecommerce-network
    container_name: ecommerce-beat

  nginx:
    image: nginx:latest
    ports:
      - 80:80
    depends_on:
      - web
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - shared:/shared
    networks:
      - ecommerce-network
    container_name: ecommerce-nginx
  
  frontend:
    build:
      context: ../e-commerce_front
      # HACK: for production: dockerfile -> Dockerfile
      dockerfile: Dockerfile.dev

    # For dev: mount your code
    volumes:
      - ../e-commerce_front:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - 5173:5173
    environment:
      - NODE_ENV=development
      - VITE_API_URL=/api
    depends_on:
      - web
    networks:
      - ecommerce-network
    container_name: ecommerce-front

volumes:
  ecommerce_db:
  shared:

