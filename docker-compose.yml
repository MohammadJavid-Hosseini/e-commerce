services:
  db:
    image: postgres:17.5-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    env_file:
      - .env
    volumes:
      - ecommerce_db:/var/lib/postgresql/data
    
  redis:
    image: redis:7.4.0-alpine
  
  web:
    image: ecommerce-app:latest
    command: gunicorn --bind 0.0.0.0:8000 --workers 2 --threads 5 --reload config.wsgi:application
    volumes:
      - shared:/shared
      - .:/e-commerce
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - .env   
  
  worker:
    image: ecommerce-app:latest
    command: celery -A config worker --loglevel=info
    volumes:
      - shared:/shared
      - .:/e-commerce
    depends_on:
      - db
      - redis
    env_file:
      - .env

  beat:
    image: ecommerce-app:latest
    command: celery -A config beat --loglevel=info
    volumes:
      - shared:/shared
      - .:/e-commerce
    depends_on:
      - db
      - redis
    env_file:
      - .env

  nginx:
    image: nginx:latest
    ports:
      - 80:80
    depends_on:
      - web
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - shared:/shared
  
  frontend:
    build: ./e-commerce_front
    container_name: frontend
    # For dev: mount your code
    volumes:
      - ./e-commerce_front:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - 5173:5173
    environment:
      - NODE_ENV=development
      - VITE_API_URL=/api
    depends_on:
      - web
    command: sh -c "pnpm dev --host 0.0.0.0 --port 5173"

volumes:
  ecommerce_db:
  shared:

