services:
  db:
    image: postgres:17.5-alpine
    ports:
      - "5433:5433"
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgresdata:/var/lib/postgresql/data
    
  redis:
    image: redis:7.4.0-alpine
  
  web:
    build: .
    # command: gunicorn --bind 0.0.0.0:8000 --workers 3 maktab_django_126.wsgi:application
    volumes:
      - shared:/shared
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - .env.docker
  
  worker-1:
    build: .
    command: celery -A maktab_django_126 worker --loglevel=info
    volumes:
      - shared:/shared
    ports:
      - "8001:8001"
    depends_on:
      - db
      - redis
    env_file:
      - .env.docker

  beat:
    build: .
    command: celery -A maktab_django_126 beat --loglevel=info
    volumes:
      - shared:/shared
    ports:
      - "8002:8002"
    depends_on:
      - db
      - redis
    env_file:
      - .env.docker

  # nginx:
  #   image: nginx:latest
  #   volumes:
  #     - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
  #     - shared:/shared
volumes:
  postgresdata:
  shared:
