server {
    listen 80;
    server_name e-commerce.test;

    location / {
        proxy_pass http://web:8000;  # Changed to service name
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /shared/static/;  # Changed to shared volume path
    }

    location /media/ {
        alias /shared/media/;  # Changed to shared volume path
    }
}